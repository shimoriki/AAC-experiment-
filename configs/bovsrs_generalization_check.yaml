# Supporting train-size study: 2 fast configurators x 3 sizes x 8 paired seeds.
# It is deliberately separate from the all-arm signal benchmark.
optimizers: [random, optuna_tpe]
train_families: [mixed]
train_sizes: [8, 25, 50]
seeds: [0, 1, 2, 3, 4, 5, 6, 7]
config_space: large_fixed_2opt
n_trials: 100
solver_repeats: 1
test_solver_repeats: 3
test_size: 100
n_cities: 50
max_steps: 10000
tpe_startup_trials: 15
smac_initial_configs: 15
smac_retrain_after: 8
smac_max_config_calls: 8
progress_interval: 20
