[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aac_tsp"
version = "0.1.0"
description = "Configuration generalization / overtuning study: TSP + Simulated Annealing + Bayesian Optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "optuna>=3.6",
    "numba>=0.59",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
